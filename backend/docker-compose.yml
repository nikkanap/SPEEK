services: 
  db: # database service
    container_name: speek-postgres
    image: speek-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER} # from env
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
    - '5332:5432'
    build: .
    env_file:
    - .env
    volumes: # persistent data
    - db_data:/usr/lib/postgresql/16/bin/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s # for now since small db
  makemigrations: 
    container_name: speek-makemigrations
    image: speek-makemigrations
    env_file:
      - .env
    build: .
    command: python manage.py makemigrations
    depends_on: 
      db: 
        condition: service_healthy
  migrate: # django migrate
    container_name: speek-migrate
    image: speek-migrate
    env_file:
      - .env
    build: .
    command: python manage.py migrate
    depends_on:
      makemigrations:
        condition: service_completed_successfully
  server: # webserver
    container_name: speek-server
    image: speek-server
    env_file:
      - .env
    ports:
      - '8000:8000'
    # later na it gunicorn or uvicorn 
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    #volumes: 
      #- web_data:\.:/app
    depends_on:
      migrate: 
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  web_data:
  db_data:
    driver: local


  